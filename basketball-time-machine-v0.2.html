function standingsTable(con){let t=E.sorted(w,con);return `<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Team</th><th class="num">W</th><th class="num">L</th><th class="num">PCT</th></tr></thead><tbody>${t.map((x,i)=>`<tr class="${x.id===w.userTeam?'mine':''}"><td>${i+1}</td><td><span class="chip"><span class="team-dot" style="background:${x.color}"></span>${escapeHTML(x.name)}</span></td><td class="num">${x.wins}</td><td class="num">${x.losses}</td><td class="num">${x.wins+x.losses?num(x.wins/(x.wins+x.losses),3):'.000'}</td></tr>`).join('')}</tbody></table></div>`;}
function league(){let qualified=w.players.filter(p=>p.games>=Math.max(1,w.round*.33)).sort((a,b)=>b.pts/b.games-a.pts/a.games).slice(0,10);return `${title('The League','Standings, scoring leaders, and competitive landscape.') }<div class="stack"><div class="grid two"><section class="card"><h3>Eastern Conference</h3>${standingsTable('E')}</section><section class="card"><h3>Western Conference</h3>${standingsTable('W')}</section></div><section class="card"><h3>Top scorers</h3>${qualified.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Team</th><th class="num">GP</th><th class="num">PPG</th><th class="num">RPG</th><th class="num">APG</th></tr></thead><tbody>${qualified.map(p=>`<tr><td>${escapeHTML(p.name)}</td><td>${escapeHTML(teamName(p.team))}</td><td class="num">${p.games}</td><td class="num">${num(p.pts/p.games)}</td><td class="num">${num(p.rebounds/p.games)}</td><td class="num">${num(p.assists/p.games)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Advance a schedule date to generate leaders.</div>'}</section><section class="card"><h3>League front-office directions</h3><p class="muted smalltext">AI teams periodically reassess their championship window. These directions influence trade demands.</p>${w.teams.filter(t=>t.id!==w.userTeam).map(t=>`<div class="kv"><span>${escapeHTML(t.name)}</span><strong>${escapeHTML(E.strategyLabel(E.orgStrategy(w,t.id)))}</strong></div>`).join('')}</section></div>`;}
function market(){let mine=E.roster(w,w.userTeam).sort((a,b)=>E.rating(b)-E.rating(a)),theirTeams=w.teams.filter(x=>x.id!==w.userTeam),t=ui.theirTeam&&theirTeams.some(x=>x.id===ui.theirTeam)?ui.theirTeam:theirTeams[0]?.id,choices=w.players.filter(p=>p.team===t&&!p.retired).sort((a,b)=>E.rating(b)-E.rating(a));ui.theirTeam=t;if(!choices.some(p=>p.id===ui.theirPlayer))ui.theirPlayer=choices[0]?.id||'';let myPicks=E.availablePicks(w,w.userTeam),theirPicks=E.availablePicks(w,t);let free=w.players.filter(p=>!p.team&&!p.retired).sort((a,b)=>E.rating(b)-E.rating(a)).slice(0,25);let ps=(arr,val,optional=false)=>`${optional?'<option value="">None</option>':''}${arr.map(p=>`<option value="${p.id}" ${p.id===val?'selected':''}>${escapeHTML(p.name)} (${p.pos}, ${E.rating(p)} OVR)</option>`).join('')}`,ks=(arr,val)=>`<option value="">None</option>${arr.map(p=>`<option value="${p.id}" ${p.id===val?'selected':''}>${p.year} ${p.round===1?'1st':'2nd'} · original ${p.originalTeam}</option>`).join('')}`;let direction=E.orgStrategy(w,t),orgText=direction==='rebuild'?'Seeking prospects and future picks':direction==='winNow'?'Seeking reliable contributors and immediate upgrades':'Balancing youth with immediate production';let target=choices.find(p=>p.id===ui.theirPlayer);return `${title('Trade Center & Free Agency','Negotiate with team-specific front offices. Draft picks are actual future assets.') }<div class="stack"><div class="grid two"><section class="card"><div class="headline"><h3>Trade builder</h3><span class="tag gold">PLAYER + PICK PACKAGES</span></div><div class="field"><label>Team to call</label><select id="tradeTeam">${theirTeams.map(x=>`<option value="${x.id}" ${x.id===t?'selected':''}>${escapeHTML(x.name)}</option>`).join('')}</select></div><div class="notice-quote" style="margin:13px 0"><strong>${escapeHTML(E.strategyLabel(direction))}:</strong> ${escapeHTML(orgText)}.</div><h3 style="margin:12px 0">You receive</h3><div class="field"><label>Target player</label><select id="tradeTheir">${ps(choices,ui.theirPlayer)}</select></div>${target&&E.protectedStar(w,target,t)?`<p class="bad smalltext" style="margin:5px 0">${escapeHTML(teamName(t))} currently view ${escapeHTML(target.name)} as untouchable.</p>`:''}<div class="grid two" style="margin-top:10px"><div class="field"><label>Another player</label><select id="tradeTheir2">${ps(choices,ui.theirPlayer2,true)}</select></div><div class="field"><label>Draft pick</label><select id="tradeTheirPick">${ks(theirPicks,ui.theirPick)}</select></div></div><div class="line"></div><h3 style="margin:12px 0">You send</h3><div class="grid two"><div class="field"><label>Player</label><select id="tradeMine">${ps(mine,ui.myPlayer,true)}</select></div><div class="field"><label>Another player</label><select id="tradeMine2">${ps(mine,ui.myPlayer2,true)}</select></div></div><div class="grid two" style="margin-top:10px"><div class="field"><label>Draft pick</label><select id="tradeMyPick">${ks(myPicks,ui.myPick)}</select></div><div class="field"><label>Another draft pick</label><select id="tradeMyPick2">${ks(myPicks,ui.myPick2)}</select></div></div><div class="actions" style="margin-top:17px">${btn('Evaluate & propose trade','propose-trade','primary','',!E.tradeWindowOpen(w))}${btn('Find Deal for target','find-deal','green','',!E.tradeWindowOpen(w))}</div><p class="muted tiny">Trades are open before the in-season deadline and throughout the offseason, including draft night. You may manually offer first-round picks even if the assistant GM is forbidden from suggesting them.</p></section><div class="stack"><section class="card"><h3>Find Deal — how it works</h3><p class="muted smalltext">Pick an opponent and a player, then press Find Deal. The assistant searches for a package matching the other team's direction and your untouchables, age, and pick restrictions.</p><div class="kv"><span class="muted">Your franchise</span><strong>${escapeHTML(E.strategyLabel(E.orgStrategy(w,w.userTeam)))}</strong></div><div class="kv"><span class="muted">Their franchise</span><strong>${escapeHTML(E.strategyLabel(direction))}</strong></div><div class="kv"><span class="muted">Your tradeable draft picks</span><strong>${myPicks.length}</strong></div><div class="kv"><span class="muted">Assistant can suggest 1sts</span><strong>${w.directives.draftPickLock?'No':'Yes'}</strong></div></section>${dealResult()}<section class="card"><h3>Upcoming picks — your franchise</h3>${myPicks.slice(0,8).map(p=>`<div class="kv"><span>${p.year} ${p.round===1?'1st':'2nd'} round</span><span class="muted smalltext">From ${p.originalTeam}</span></div>`).join('')||'<div class="empty">No available future picks.</div>'}</section></div></div><section class="card"><h3>Unsigned player pool</h3>${free.length?free.slice(0,12).map(p=>`<div class="kv"><span><strong>${escapeHTML(p.name)}</strong> <span class="muted tiny">${p.pos} · OVR ${E.rating(p)} · ${p.age}yo</span></span>${btn('Sign','sign','green small',`data-id="${p.id}"`)}</div>`).join(''):'<div class="empty">There are no unsigned players at this point.</div>'}</section></div>`;}
function specialOffseasonStories(){if(w.phase!=='offseason'||w.offseasonStep===0)return '';let own=E.roster(w,w.userTeam).filter(p=>p.age>=33&&p.lead>=64),ret=w.players.filter(p=>p.retired&&p.age>=33&&p.age<=43).sort((a,b)=>E.rating(b)-E.rating(a)).slice(0,8);return `<section class="card"><h3>Veteran careers & rare opportunities</h3><p class="muted smalltext">Players can decline. Successful player-coach appointments are deliberately unlikely.</p>${own.map(p=>`<div class="kv"><span>${escapeHTML(p.name)} <span class="muted tiny">Age ${p.age} · Leadership ${p.lead}</span></span>${btn('Discuss player-coach role','ask-player-coach','ghost small',`data-id="${p.id}"`)}</div>`).join('')}${ret.length?`<div class="line"></div><h3>Recently retired / available for comeback talks</h3>${ret.map(p=>`<div class="kv"><span>${escapeHTML(p.name)} <span class="muted tiny">${p.previousTeam||''} · ${p.age}yo</span></span>${btn('Ask to return','retirement-talk','ghost small',`data-id="${p.id}"`)}</div>`).join('')}`:''}</section>`;}
function offseason(){let steps=['Season recap & progression','NBA Draft','Contract review','Free agency','Training camp'];if(w.phase==='regular')return `${title('Offseason','Future draft classes and franchise evolution.') }<section class="card"><h3>Preparation board</h3><p class="muted">The draft occurs after the playoffs. ${w.year+1} contains ${w.year+1<=1985?'curated historical prospect names with fictional filler':'procedurally generated prospects until the full archive is imported'}.</p><div class="actions">${btn('View draft names','show-draft','ghost')}${btn('Back to season','nav','primary','data-tab="desk"')}</div></section>`;
if(w.phase==='playoffs')return `${title('Playoffs','The season has ended. Simulate the bracket to reach the offseason.') }<section class="card"><h3>Postseason is ready</h3><p class="muted">Your franchise competes automatically. Current alpha uses a simplified 16-team best-of-seven bracket; era-accurate playoff formats come later.</p>${btn('Simulate playoffs & Finals','playoffs','primary')}</section>`;
let stage=w.offseasonStep,order=E.draftOrder(w),owner=order[w.draftPos],myPick=owner===w.userTeam;let draftList=w.draft.slice().sort((a,b)=>a.projected-b.projected).slice(0,18);return `${title('Offseason Command Center',`Step ${stage+1} of 5 · ${steps[stage]}`)}<div class="stack"><div class="grid three">${steps.map((s,i)=>`<div class="card" style="padding:12px;border-color:${i===stage?'var(--gold)':'var(--edge2)'}"><div class="metric-caption">${i<stage?'✓':i===stage?'ACTIVE':'UP NEXT'}</div><div class="smalltext"><strong>${s}</strong></div></div>`).join('')}</div>${stage===0?`<section class="card"><h3>Season complete</h3><p class="muted">${escapeHTML(teamName(w.champion))} are champions. Review the league chronicle, then open player progression and the draft.</p>${btn('Process retirements and open draft','off-next','primary')}</section>`:''}${stage===1?`<section class="card"><div class="headline"><div><h3>${w.year+1} Rookie Draft</h3><p class="muted smalltext">Pick ${w.draftPos+1}/${order.length} · On the clock: ${escapeHTML(teamName(owner))}</p></div><span class="tag gold">${myPick?'YOUR PICK':'AI PICK'}</span></div><p class="muted smalltext">Early class names are historical; ratings and potential are estimated. Scouting may conceal exact ceilings.</p><div class="actions" style="margin:12px 0">${btn('Advance to my pick','draft-until','green','',myPick)}${btn('Auto-complete draft','draft-all','ghost')}</div><div class="line"></div>${draftList.map(p=>`<div class="draft-row"><div><strong>${escapeHTML(p.name)}</strong> <span class="muted tiny">${p.pos} · projected #${p.projected} · ${p.origin==='draft-fictional'?'fictional filler':'historical name'}</span><div class="muted tiny">Scouts estimate OVR ${Math.round(.43*p.off+.25*p.def+.13*p.reb+.1*p.ast+.09*p.dur)} • Ceiling ${w.settings.scoutingFog?'Uncertain':p.pot}</div></div>${btn('Draft','draft-pick','primary small',`data-id="${p.id}"`,!myPick)}</div>`).join('')}</section>`:''}${stage===2?`<section class="card"><h3>Contracts & veteran decisions</h3><p class="muted">Players with expiring contracts have entered the unsigned pool. In this alpha, contract negotiation is simplified to direct signings.</p>${btn('Proceed to free agency','off-next','primary')} ${btn('View unsigned players','nav','ghost','data-tab="market"')}</section>`:''}${stage===3?`<section class="card"><h3>Free agency</h3><p class="muted">Evaluate the unsigned pool, make signings, then advance to training camp.</p><div class="actions">${btn('Explore free agents','nav','ghost','data-tab="market"')}${btn('Start training camp','off-next','primary')}</div></section>`:''}${stage===4?`<section class="card"><h3>Training camp</h3><p class="muted">Your coach will choose the rotation. You can discuss your organizational game plan before opening night.</p><div class="actions">${btn('Talk to head coach','nav','ghost','data-tab="coach"')}${btn('Begin the next season','off-next','primary')}</div></section>`:''}${specialOffseasonStories()}</div>`;}
function renderNews(news){return news.map(n=>`<article class="news"><div class="headline"><div><span class="tag ${n.importance==='major'?'gold':''}">${escapeHTML(n.kind)}</span><h4>${escapeHTML(n.headline)}</h4><div class="muted smalltext">${escapeHTML(n.detail)}</div></div><span class="muted tiny" style="white-space:nowrap">${n.year+1} · ${n.round}</span></div></article>`).join('')||'<div class="empty">No stories yet.</div>'}
function chronicle(){return `${title('League Chronicle','Your alternate basketball history, captured as it actually unfolds.') }<div class="stack"><section class="card"><div class="headline"><h3>Historical timeline</h3><span class="tag">${w.news.length} reports</span></div><div class="line"></div>${renderNews(w.news)}</section></div>`;}
function settings(){let d=w.directives,s=w.settings,t=E.myTeam(w),players=E.roster(w,w.userTeam).sort((a,b)=>E.rating(b)-E.rating(a));return `${title('Universe Settings','Control automation, realism, coaching authority, and assistant GM boundaries.') }<div class="stack"><section class="card"><h3>Your GM profile</h3><div class="grid two"><div class="field"><label>GM name</label><input id="gmProfileName" data-setting="profile" data-key="name" value="${escapeHTML(w.gm.name||'')}" maxlength="60" placeholder="Enter your name"/></div><div class="field"><label>Role</label><select data-setting="profile" data-key="title">${['General Manager','President & GM'].map(x=>`<option value="${x}" ${x===w.gm.title?'selected':''}>${x}</option>`).join('')}</select></div></div></section><div class="grid two"><section class="card"><h3>Simulation preferences</h3>${[['autoStop','Stop at important events','Pause if an injury or trade deadline requires attention.'],['coachOverride','Override coaching autonomy','GM preferences directly apply instead of the coach\'s plan.'],['scoutingFog','Uncertain scouting','Hide precise player potential numbers.'],['historicalHints','Historical comparisons','Allow future real-life career comparisons in storylines.'],['autoTraining','Delegate player development','Automatic offseason training (the only alpha development mode).'],['ownerPressure','Ownership pressure','Owners may hold the front office accountable after a disappointing season.']].map(([k,n,desc])=>`<div class="toggle-row"><div><strong class="smalltext">${n}</strong><div class="muted tiny">${desc}</div></div><input type="checkbox" data-setting="flag" data-key="${k}" ${s[k]?'checked':''}></div>`).join('')}</section><section class="card"><h3>Assistant GM instructions</h3><div class="field"><label>Team direction</label><select data-setting="directive" data-key="teamDirection">${['rebuild','retool','winNow'].map(x=>`<option value="${x}" ${d.teamDirection===x?'selected':''}>${E.strategyLabel(x)}</option>`).join('')}</select></div><div class="field" style="margin-top:14px"><label>Maximum acquisition age: ${d.maxVeteranAge}</label><input type="range" min="24" max="40" value="${d.maxVeteranAge}" data-setting="directive" data-key="maxVeteranAge"></div><div class="field" style="margin-top:14px"><label>Minimum target overall: ${d.minimumTradeValue}</label><input type="range" min="58" max="95" value="${d.minimumTradeValue}" data-setting="directive" data-key="minimumTradeValue"></div><div class="toggle-row"><div><strong class="smalltext">Protect first-round picks</strong><div class="muted tiny">Assistant GM will not include them in Find Deal proposals.</div></div><input type="checkbox" data-setting="directive-check" data-key="draftPickLock" ${d.draftPickLock?'checked':''}></div><div class="field" style="margin-top:12px"><label>Risk profile</label><select data-setting="directive" data-key="signingRisk">${['conservative','balanced','aggressive'].map(x=>`<option value="${x}" ${d.signingRisk===x?'selected':''}>${E.strategyLabel(x)}</option>`).join('')}</select></div><div class="line"></div><h3>Untouchable players</h3>${players.filter(p=>p.origin!=='placeholder').map(p=>`<div class="toggle-row"><span class="smalltext">${escapeHTML(p.name)}</span><input type="checkbox" data-setting="untouchable" data-id="${p.id}" ${d.tradeUntouchable.includes(p.id)?'checked':''}></div>`).join('')}</section></div><section class="card"><h3>Save management</h3><p class="muted smalltext">The game autosaves in this browser. Export a JSON file to keep a portable backup or move to another device.</p><div class="actions">${btn('Manage universes','open-saves','ghost')}${btn('Download this universe','export','green')}${btn('Import a save','import','ghost')}</div><input id="importFile" type="file" accept=".json,application/json" style="display:none"/><div class="line"></div><div class="data-warning"><strong>Development note:</strong> historical season selection beyond 1979–80, complete rosters, era-accurate salary rules, and historical playoff formats are not complete. Draft pick trades and multi-asset deals are prototype approximations. The simulation remains a first alpha.</div></section></div>`;}
function showModal(html){modal=html;renderModal()}
function renderModal(){let bg=$('#modal'),target=$('#modalContent');if(!modal){bg.classList.add('hidden');bg.setAttribute('aria-hidden','true');target.innerHTML='';return;}bg.classList.remove('hidden');bg.setAttribute('aria-hidden','false');target.innerHTML=modal;}
function closeModal(){modal=null;renderModal()}
function newGameFields(){return `<div class="grid two"><div class="field"><label>Historical starting era</label><select id="newEra"><option value="1979">1979–80 · Three-point era begins</option><option disabled>1966–67 · Early NBA — coming later</option><option disabled>1976–77 · ABA merger — coming later</option><option disabled>1984–85 · Jordan — coming later</option></select></div><div class="field"><label>Your franchise</label><select id="newTeam"><option value="">Choose a team…</option>${BTM_DATA.teams.map(t=>`<option value="${t[0]}">${escapeHTML(t[1])}</option>`).join('')}</select></div></div><div class="grid two" style="margin-top:14px"><div class="field"><label>Your GM's name (optional)</label><input id="newName" maxlength="60" placeholder="Your GM name"/></div><div class="field"><label>Role</label><select id="newRole"><option value="General Manager">General Manager</option><option value="President & GM">President of Basketball Operations & GM</option></select></div></div><div class="grid two" style="margin-top:14px"><div class="field"><label>Team-building philosophy</label><select id="newDirection"><option value="retool">Retool / remain competitive</option><option value="rebuild">Rebuild for the future</option><option value="winNow">Win now / chase a title</option></select></div><div class="field"><label>Coaching authority</label><select id="newCoachAuthority"><option value="coach">Coach controls lineups (GM advises)</option><option value="override">GM can override rotations and plan</option></select></div></div><div class="toggle-row"><div><strong class="smalltext">Strict assistant GM guardrails</strong><div class="muted tiny">Assistant won't suggest trading future 1sts or untouchable players unless you change it later.</div></div><input type="checkbox" id="newGuardrails" checked></div><div class="toggle-row"><div><strong class="smalltext">Scouting uncertainty</strong><div class="muted tiny">Prospect ceilings are estimates; you can't see everything.</div></div><input type="checkbox" id="newScouting" checked></div><div class="field" style="margin-top:12px"><label>Universe name (optional)</label><input id="newLabel" type="text" maxlength="60" placeholder="My alternate NBA"/></div><div class="data-warning" style="margin-top:14px">This alpha currently supports 1979–80 only. Future eras and some rosters are incomplete; we'll expand the historical database without changing your GM setup.</div>`;}
function renderLanding(){let slots=getSlots(),ids=Object.keys(slots).sort((a,b)=>(slots[b]?.updated||'').localeCompare(slots[a]?.updated||''));$('#hero').innerHTML='<div><div class="eyebrow">WELCOME TO BASKETBALL TIME MACHINE</div><h1>Write an entirely different NBA history.</h1><p>Choose a franchise, create your GM, and decide how much authority you want.</p></div>';$('#nav').classList.add('hidden');$('#saveBadge').textContent='● Local universes';$('#view').innerHTML=`<div class="stack"><section class="card"><div class="eyebrow">CREATE YOUR GENERAL MANAGER</div><h2 style="margin:4px 0 12px">Start a new universe</h2>${newGameFields()}<div class="actions" style="margin-top:18px">${btn('Begin my GM career →','create-universe','primary large')}</div></section>${ids.length?`<section class="card"><h3>Continue an existing universe</h3><p class="muted smalltext">Starting a new game will not overwrite these saved universes.</p>${ids.map(id=>`<div class="slot"><div><strong>${escapeHTML(slots[id].label||slots[id].name||'Universe')}</strong><div class="muted tiny">${escapeHTML(slots[id].season)} · ${escapeHTML(slots[id].name)}</div></div>${btn('Continue','load-slot','green small',`data-id="${escapeHTML(id)}"`)}</div>`).join('')}</section>`:''}<section class="card"><h3>Import an earlier save</h3><p class="muted smalltext">If you played the first alpha in another browser or file, you can import that universe.</p>${btn('Import JSON save','import','ghost')}<input id="importFile" type="file" accept=".json,application/json" style="display:none"/></section></div>`;renderModal();}
function collectOffer(){let theirTeam=$('#tradeTeam')?.value||ui.theirTeam;let give=[],receive=[],add=(a,kind,id)=>{if(id)a.push({kind,id})};add(give,'player',$('#tradeMine')?.value);add(give,'player',$('#tradeMine2')?.value);add(give,'pick',$('#tradeMyPick')?.value);add(give,'pick',$('#tradeMyPick2')?.value);add(receive,'player',$('#tradeTheir')?.value);add(receive,'player',$('#tradeTheir2')?.value);add(receive,'pick',$('#tradeTheirPick')?.value);return {theirTeam,give,receive};}
function dealResult(){let d=ui.deal;if(!d)return '';let org=E.strategyLabel(d.strategy);if(d.status==='offer')return `<div class="deal-panel"><div class="tag gold">POTENTIAL COUNTEROFFER</div><h3 style="margin:8px 0">${escapeHTML(teamName(d.team))} — ${org}</h3><p class="muted smalltext">${escapeHTML(d.message)}</p><div class="grid two"><div><strong class="smalltext">You receive</strong>${d.receive.map(a=>`<div class="kv smalltext">${escapeHTML(E.assetLabel(w,a))}</div>`).join('')}</div><div><strong class="smalltext">You send</strong>${d.give.map(a=>`<div class="kv smalltext">${escapeHTML(E.assetLabel(w,a))}</div>`).join('')}</div></div><p class="muted tiny">This is a valuation-based estimate, not a binding negotiation. It honors your assistant GM's current restrictions.</p><div class="actions">${btn('Propose this package','accept-deal','primary')}${btn('Dismiss','clear-deal','ghost')}</div></div>`;return `<div class="deal-panel"><div class="tag ${d.status==='untouchable'?'red':''}">${d.status==='untouchable'?'UNTOUCHABLE':d.status==='closed'?'TRADE WINDOW CLOSED':'NO ACCEPTABLE OFFER FOUND'}</div><p style="margin:8px 0">${escapeHTML(d.message)}</p><div class="muted tiny">Other franchise direction: ${escapeHTML(org)}. You can still modify a manual trade offer where permitted.</div>${btn('Dismiss','clear-deal','ghost small')}</div>`;}

function newGameModal(){if(!w){renderLanding();return;}showModal(`<button class="modal-close" data-action="close-modal">×</button><div class="eyebrow">A NEW UNIVERSE</div><h2>Build your GM career.</h2><p class="muted smalltext">Create a separate universe. Your current save stays intact.</p>${newGameFields()}<div class="modal-footer">${btn('Cancel','close-modal','ghost')}${btn('Create universe','create-universe','primary')}</div>`);}
function savesModal(){let slots=getSlots();showModal(`<button class="modal-close" data-action="close-modal">×</button><div class="eyebrow">MULTIVERSE ARCHIVE</div><h2>Your universes</h2><p class="muted smalltext">Each save follows its own timeline. The current browser retains these locally.</p>${Object.keys(slots).map(id=>`<div class="slot"><div><strong>${escapeHTML(slots[id].label||slots[id].name)}</strong><div class="muted tiny">${escapeHTML(slots[id].season)} ${id===slotId?'· Active':''}</div></div><div class="actions">${btn('Load','load-slot','primary small',`data-id="${escapeHTML(id)}"`)}${btn('Delete','delete-slot','danger small',`data-id="${escapeHTML(id)}"`)}</div></div>`).join('')}${btn('+ Start a new history','new-game','green')}<div class="modal-footer">${btn('Close','close-modal','ghost')}</div>`)}
function draftModal(){let list=w.draft.slice(0,24);showModal(`<button class="modal-close" data-action="close-modal">×</button><div class="eyebrow">${w.year+1} ROOKIE CLASS</div><h2>Upcoming prospects</h2><p class="muted smalltext">Historical names are a limited curated selection. Unlisted prospects and later years use clearly labeled fictional fillers.</p>${list.map(p=>`<div class="kv"><span>${escapeHTML(p.name)}</span><span class="muted smalltext">${p.pos} · ${p.origin==='draft-fictional'?'Fictional':'Historical name'}</span></div>`).join('')}<div class="modal-footer">${btn('Close','close-modal','ghost')}</div>`)}
function afterAction(res){if(res?.message)notify(res.message);if(res?.error)notify(res.error)}
document.addEventListener('click',e=>{let node=e.target.closest('[data-action]');if(!node)return;let a=node.dataset.action,k=node.dataset.key,id=node.dataset.id;try{if(a==='nav'){if(!w)return;tab=node.dataset.tab;render();return;}if(a==='open-saves'){savesModal();return;}if(a==='new-game'){newGameModal();return;}if(a==='close-modal'){closeModal();return;}if(a==='create-universe'){let team=$('#newTeam')?.value||'',label=$('#newLabel')?.value.trim()||'';if(!team){notify('Please choose a franchise to begin.');$('#newTeam')?.focus();return;}w=E.create(team,(Date.now()^(Math.floor(Math.random()*1000000)))>>>0);w.gm.name=$('#newName')?.value.trim()||'';w.gm.title=$('#newRole')?.value||'General Manager';w.settings.coachOverride=$('#newCoachAuthority')?.value==='override';w.settings.scoutingFog=$('#newScouting')?.checked??true;w.directives.draftPickLock=$('#newGuardrails')?.checked??true;w.directives.teamDirection=$('#newDirection')?.value||'retool';slotId='universe-'+Date.now();let slots=getSlots();slots[slotId]={label:label||teamName(team),name:teamName(team),season:'1979–80',data:w};try{localStorage.setItem('btm_slots',JSON.stringify(slots))}catch{};tab='desk';ui.deal=null;closeModal();store();render();notify('New basketball history created.');return;}if(a==='load-slot'){let sl=getSlots()[id];if(sl){w=E.validateSave(sl.data);slotId=id;tab='desk';ui.deal=null;ui.theirTeam='';store();closeModal();render();notify('Universe loaded.');}return;}if(a==='delete-slot'){if(id===slotId){notify('Load another universe before deleting the active one.');return;}if(!confirm('Delete this universe from this browser? This cannot be undone.'))return;let all=getSlots();delete all[id];localStorage.setItem('btm_slots',JSON.stringify(all));savesModal();return;}if(a==='advance'){mutate(()=>{let n=E.advance(w,+node.dataset.rounds);if(n>0)notify(`${n} schedule date${n===1?'':'s'} simulated.`);else notify('There is nothing left to simulate in this phase.');});return;}if(a==='dismiss'){mutate(()=>w.alerts.shift());return;}if(a==='playoffs'){mutate(()=>{let r=E.playoffs(w);if(r)notify(`${teamName(r.winner)} are NBA champions!`);tab='offseason';});return;}if(a==='goto-offseason'){tab='offseason';render();return;}if(a==='off-next'){mutate(()=>{E.offSeasonNext(w);});return;}if(a==='draft-until'){mutate(()=>{E.autoUntilUser(w);});return;}if(a==='draft-all'){if(!confirm('Let the assistant complete the rest of the draft, including your picks?'))return;mutate(()=>E.autoFinishDraft(w));return;}if(a==='draft-pick'){mutate(()=>afterAction(E.draftPick(w,id)));return;}if(a==='coach-talk'){mutate(()=>afterAction(E.coachTalk(w,node.dataset.type)));return;}if(a==='move-rotation'){mutate(()=>E.moveRotation(w,id,+node.dataset.dir));return;}if(a==='hire-coach'){if(!confirm('Replace your head coach with this candidate?'))return;mutate(()=>afterAction(E.hireCoach(w,id)));return;}if(a==='ask-player-coach'){mutate(()=>afterAction(E.askPlayerCoach(w,id)));return;}if(a==='retirement-talk'){mutate(()=>afterAction(E.annualRetirementTalk(w,id)));return;}if(a==='propose-trade'){let offer=collectOffer();mutate(()=>{afterAction(E.tradePackage(w,offer.theirTeam,offer.give,offer.receive));ui.deal=null;});return;}if(a==='find-deal'){ui.theirPlayer=$('#tradeTheir').value;ui.theirTeam=$('#tradeTeam').value;ui.deal=E.findDeal(w,ui.theirPlayer);render();return;}if(a==='accept-deal'){let d=ui.deal;if(!d||d.status!=='offer')return;mutate(()=>{afterAction(E.tradePackage(w,d.team,d.give,d.receive));ui.deal=null;});return;}if(a==='clear-deal'){ui.deal=null;render();return;}if(a==='sign'){mutate(()=>afterAction(E.sign(w,id)));return;}if(a==='waive'){if(!confirm('Release this player to the unsigned pool?'))return;mutate(()=>afterAction(E.waive(w,id)));return;}if(a==='show-draft'){draftModal();return;}if(a==='export'){let json=E.exportSave(w),blob=new Blob([json],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`basketball-time-machine-${w.userTeam}-${w.year}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('Save exported to a JSON file.');return;}if(a==='import'){$('#importFile')?.click();return;}}catch(err){console.error(err);notify(err.message);}});
document.addEventListener('change',e=>{let t=e.target;try{if(t.id==='tradeTeam'){ui.theirTeam=t.value;ui.theirPlayer='';ui.theirPlayer2='';ui.theirPick='';ui.deal=null;render();return;}if(t.id==='tradeTheir'){ui.theirPlayer=t.value;ui.deal=null;return;}if(t.id==='tradeMine'){ui.myPlayer=t.value;return;}if(['tradeMine2','tradeMyPick','tradeMyPick2','tradeTheir2','tradeTheirPick'].includes(t.id)){ui[{tradeMine2:'myPlayer2',tradeMyPick:'myPick',tradeMyPick2:'myPick2',tradeTheir2:'theirPlayer2',tradeTheirPick:'theirPick'}[t.id]]=t.value;return;}if(t.id==='importFile'){let file=t.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let parsed=E.validateSave(JSON.parse(reader.result));w=parsed;slotId='import-'+Date.now();tab='desk';ui.deal=null;ui.theirTeam='';store();render();notify('Universe imported successfully.');}catch(err){notify('Import failed: '+err.message)}};reader.readAsText(file);return;}let kind=t.dataset.setting,k=t.dataset.key;if(!kind)return;mutate(()=>{if(kind==='flag'){w.settings[k]=t.checked;}if(kind==='profile')w.gm[k]=t.value;if(kind==='directive')w.directives[k]=t.type==='range'?+t.value:t.value;if(kind==='directive-check')w.directives[k]=t.checked;if(kind==='untouchable'){w.directives.tradeUntouchable=w.directives.tradeUntouchable.filter(x=>x!==t.dataset.id);if(t.checked)w.directives.tradeUntouchable.push(t.dataset.id);}if(kind==='plan')E.savePlan(w,k,+t.value);});}catch(err){notify(err.message)}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
boot();
})();
</script>
